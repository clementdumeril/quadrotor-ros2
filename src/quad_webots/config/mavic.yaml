# Parameters of the Webots driver plugin (node "mavic").
# Rotor geometry: Propeller.centerOfThrust in Mavic2Pro.proto (R2025a) minus the body
# centre of mass (-0.088, 0, -0.04). Order: front left, front right, rear left, rear right.
# Thrust f = k_thrust * w^2 and reaction torque k_torque * w^2 (Propeller thrust/torqueConstants).
# mass is the value the controllers use; it is checked by the hover test (README).
/**:   # the driver node is named after the robot
  ros__parameters:
    use_sim_time: true
    mass: 0.5
    k_thrust: 2.6e-4
    k_torque: 5.2e-6
    max_motor_speed: 576.0
    rotor_x: [0.1428537, 0.1428537, -0.089179, -0.089179]
    rotor_y: [0.151294, -0.151294, 0.127453, -0.127453]
    rotor_spin: [1, -1, -1, 1]
    kp_rate: [0.05, 0.05, 0.02]
    ki_rate: [0.1, 0.1, 0.02]
    rate_integral_limit: [0.05, 0.05, 0.02]
    cmd_timeout: 0.3
