# Parameters of the Webots driver plugin (node "mavic").
# Rotor geometry: Propeller.centerOfThrust in Mavic2Pro.proto (R2025a) minus the body
# whole-robot centre of mass (-0.0607, 0, -0.0364), measured with the supervisor API at start-up
# (the body alone is at -0.088; propellers and gimbal move it forward).
# Order: front left, front right, rear left, rear right.
# Thrust f = k_thrust * w^2 and reaction torque k_torque * w^2 (Propeller thrust/torqueConstants).
# mass: whole robot, from the steady hover thrust of the position controller (4.80-4.94 N over two flights -> 0.49-0.50 kg);
# an open-loop step at 80 rad/s gave 0.58 kg (rough, from a 0.5 s acceleration window).
/**:   # the driver node is named after the robot
  ros__parameters:
    use_sim_time: true
    mass: 0.50
    k_thrust: 2.6e-4
    k_torque: 5.2e-6
    max_motor_speed: 576.0
    rotor_x: [0.1155537, 0.1155537, -0.116479, -0.116479]
    rotor_y: [0.151294, -0.151294, 0.127453, -0.127453]
    rotor_spin: [1, -1, -1, 1]
    # Explicit rotor model: forces applied at Propeller.centerOfThrust (robot frame).
    thrust_point_x: [0.0548537, 0.0548537, -0.177179, -0.177179]
    thrust_point_y: [0.151294, -0.151294, 0.127453, -0.127453]
    thrust_point_z: [-0.00280468, -0.00280468, -0.0320282, -0.0320282]
    motor_time_constant: 0.03     # [s], first-order rotor speed response
    kp_rate: [0.25, 0.25, 0.05]
    ki_rate: [0.5, 0.5, 0.05]
    rate_integral_limit: [0.4, 0.4, 0.05]
    cmd_timeout: 0.3
