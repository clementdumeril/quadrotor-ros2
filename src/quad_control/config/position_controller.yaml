position_controller:
  ros__parameters:
    use_sim_time: true
    mass: 0.5                     # same value as the driver; the z integral absorbs the error
    rate_hz: 100.0
    kp_pos: [1.5, 1.5, 2.0]       # [1/s]
    kp_vel: [3.0, 3.0, 4.0]       # [1/s]
    ki_vel: [0.3, 0.3, 1.0]       # [1/s^2]
    kp_att: [6.0, 6.0, 3.0]       # [rad/s per rad]
    max_vel_xy: 2.0               # [m/s]
    max_vel_z: 1.0                # [m/s]
    max_tilt_deg: 30.0
    max_rate: [3.0, 3.0, 1.5]     # [rad/s]
