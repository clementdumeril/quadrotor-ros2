position_controller:
  ros__parameters:
    use_sim_time: true
    mass: 0.50                    # same value as the driver; the z integral absorbs the error
    rate_hz: 100.0
    # Gains from a short sweep at 4 m/s (figure eight): the stiffest stable setting; the next
    # step (kp_att 20, kp_pos 5, kp_vel 10) diverged. The square-flight figure used 1.5 / 3.0 / 6.0.
    kp_pos: [3.5, 3.5, 4.0]       # [1/s]
    kp_vel: [7.0, 7.0, 8.0]       # [1/s]
    ki_vel: [0.3, 0.3, 1.0]       # [1/s^2]
    kp_att: [15.0, 15.0, 5.0]     # [rad/s per rad]
    max_vel_xy: 2.0               # [m/s], on the position feedback only (the reference velocity is added)
    max_vel_z: 1.0                # [m/s]
    max_tilt_deg: 60.0            # thrust-to-weight 2 allows 60 deg in level flight
    max_rate: [6.0, 6.0, 3.0]     # [rad/s], same limits as the NMPC
    rate_feedforward: true        # body rates from the reference jerk (differential flatness)
